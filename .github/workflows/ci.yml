name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck
      
    - name: Test Ledger Service
      run: npm run test:ledger

    - name: Build
      run: npm run build
      env:
        # Provide dummy vars so Next.js can build without failing if it statically checks envs
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        LEDGERLINE_DEMO_ORG_ID: "org-ledgerline-demo"
        DATABASE_URL: "postgresql://ledgerline:ledgerline@localhost:5432/ledgerline"
        SUPABASE_URL: "https://example.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "dummy"
        SUPABASE_SECRET_KEY: "dummy"
