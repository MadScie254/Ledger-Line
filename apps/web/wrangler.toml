name = "ledgerline"
main = ".open-next/worker.js"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[hyperdrive]]
binding = "HYPERDRIVE"
# Replace before the first remote deploy. Local development reads the
# same non-production connection as the workspace's ignored .env file.
id = "00000000000000000000000000000000"
localConnectionString = "postgresql://ledgerline:ledgerline@localhost:5432/ledgerline"

[[r2_buckets]]
binding = "RECEIPTS_BUCKET"
bucket_name = "ledgerline-receipts"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "00000000000000000000000000000000"
